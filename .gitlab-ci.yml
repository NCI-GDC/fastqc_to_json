include:
  - component: $CI_SERVER_FQDN/nci-gdc/platform-engineering/generate-version/generate_version@0.4.2
    inputs:
      stage: tag

  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/workflow@<PINNED_VERSION>

  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/pre-commit@<PINNED_VERSION>

  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/tox@<PINNED_VERSION>
    inputs:
      python_version: "3.12"
      image_version: "4.4.1"

  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/docker-build@<PINNED_VERSION>

  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/docker-release@<PINNED_VERSION>

  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/docker-release-latest@<PINNED_VERSION>

stages:
  - test
  - build
  - release
  - tag

tox:
  image: docker.osdc.io/ncigdc/amzn2023-builder:4.4.1
