include:
  - component: $CI_SERVER_FQDN/nci-gdc/platform-engineering/generate-version/generate_version@0.4.2
    inputs:
      stage: release

  - component: $CI_SERVER_FQDN/nci-gdc/gitlab-templates/tox@feat/components
    inputs:
      python_version: "3.12"
      image_version: "4.4.1"

stages:
  - test
  - build
  - release

tox:
  image: docker.osdc.io/ncigdc/amzn2023-builder:4.4.1

build_docker:
  stage: build

  image: docker.osdc.io/docker:28.5.1-dind

  services:
    - docker:27.5.1-dind

  tags:
    - dind

  before_script:
    - docker info
    - apk add --no-cache bash git

  script:
    - bash build.sh

  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
