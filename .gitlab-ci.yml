include:

- project: nci-gdc/gitlab-templates
  ref: master
  file:
  - templates/global/full.yaml

variables:
  DOCKER_VERSION: 27.4.0

build_dockers:
  stage: build
  variables:
    GIT_DEPTH: 0
    BASE_CONTAINER_REGISTRY: "docker.osdc.io"
  services:
  - docker:${DOCKER_VERSION}-dind
  tags:
  - dind
  before_script:
  - docker info
  - apk add --no-cache bash moreutils git go curl just
  script:
  - docker build --progress=plain --build-arg BASE_CONTAINER_VERSION=4.4.1 -t "${CI_PROJECT_NAME}:${CI_COMMIT_SHORT_SHA}" .
