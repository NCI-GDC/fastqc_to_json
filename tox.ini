[tox]
envlist = py3,help,version,ruff,type,cov
isolated_build = true

[tox:.package]
basepython = python3

[testenv]
setenv =
    package = fastqc_to_json
    PYTHONHASHSEED = 0
passenv = PIP_EXTRA_INDEX_URL
skip_install =
    false
install_command = python3 -m pip install {opts} {packages}
extras = test
commands = pytest -vv {posargs}

[testenv:dev]
basepython = python3.11
extras =
    dev
    test

[testenv:detect-secrets]
deps =
    detect-secrets==1.5.0
skip_install =
    true
commands =
    detect-secrets scan > .secrets.baseline

[testenv:compile]
basepython = python3.11
deps =
    uv
skip_install =
    true
commands =
    uv pip compile -o requirements.txt pyproject.toml

[testenv:cov]
deps =
extras = test
commands =
    coverage run -m pytest tests/
    coverage combine
    coverage report -m
    coverage xml
    coverage xml -o test-reports/results.xml

[testenv:ruff]
skip_install = true
deps =
    ruff
commands =
    ruff check {env:package}/ tests/

[testenv:type]
skip_install = false
deps =
    mypy
extras =
    test
    dev
    type
commands =
    python3 -m mypy {env:package}/

[testenv:build]
skip_install = true
isolated_build = false
install_command = python3 -m pip install {opts} {packages}
deps =
    flit
    setuptools_scm
commands =
    python3 -m setuptools_scm
    python3 -m flit build

[testenv:help]
skip_install =
    false
deps =
commands =
    python -m {env:package} --help

[testenv:publish]
isolated_build = false
skip_install = true
passenv =
    TWINE_USERNAME
    TWINE_PASSWORD
    TWINE_REPOSITORY_URL
install_command = python3 -m pip install {opts} {packages}
deps =
    setuptools_scm
    flit
    twine
commands =
    python3 -m setuptools_scm
    python3 -m flit build
    twine check dist/*
    twine upload dist/*

[testenv:version]
skip_install = true
allowlist_externals =
    git
deps =
commands =
    git describe --tags --always

[testenv:cruft]
skip_install = true
deps =
    cruft
allowlist_externals =
    git
commands =
    cruft check
